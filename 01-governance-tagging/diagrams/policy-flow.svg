ity:0}19.0%,92.0%{opacity:1}97%,100%{opacity:0}}.cp1{animation:cp1 14s linear infinite}@keyframes oc1{0%,46.9%{opacity:0}50.0%,92.0%{opacity:1}97%,100%{opacity:0}}.oc1{animation:oc1 14s linear infinite}@keyframes mk20{0%,16.9%{opacity:0}19.0%,92.0%{opacity:1}97%,100%{opacity:0}}.mk20{animation:mk20 14s linear infinite}@keyframes mk21{0%,30.9%{opacity:0}33.0%,92.0%{opacity:1}97%,100%{opacity:0}}.mk21{animation:mk21 14s linear infinite}@keyframes mk22{0%,44.9%{opacity:0}47.0%,92.0%{opacity:1}97%,100%{opacity:0}}.mk22{animation:mk22 14s linear infinite}@keyframes mk23{0%,58.9%{opacity:0}61.0%,92.0%{opacity:1}97%,100%{opacity:0}}.mk23{animation:mk23 14s linear infinite}@keyframes mv2{0.0%{transform:translateX(0px)}6.0%{transform:translateX(0px)}16.0%{transform:translateX(210px)}30.0%{transform:translateX(390px)}44.0%{transform:translateX(570px)}58.0%{transform:translateX(750px)}92.0%{transform:translateX(750px)}100.0%{transform:translateX(750px)}}.mv2{animation:mv2 14s cubic-bezier(.45,.05,.35,1) infinite}@keyframes st2{0%,59.4%{opacity:0}61.5%,92.0%{opacity:1}97%,100%{opacity:0}}.st2{animation:st2 14s linear infinite}@keyframes cp2{0%,16.9%{opacity:0}19.0%,92.0%{opacity:1}97%,100%{opacity:0}}.cp2{animation:cp2 14s linear infinite}@keyframes oc2{0%,60.9%{opacity:0}64.0%,92.0%{opacity:1}97%,100%{opacity:0}}.oc2{animation:oc2 14s linear infinite}</style><rect x="0" y="0" width="1200" height="730" rx="18" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="96" rx="18" fill="#08152F"/><rect x="0" y="78" width="1200" height="18" fill="#08152F"/><rect x="0" y="96" width="1200" height="4" fill="#2DD4E8"/><text class="t" x="40" y="44" font-size="24" font-weight="700" fill="#FFFFFF" style="fill:#FFFFFF">How Azure Policy judged three requests</text><text class="t" x="40" y="74" font-size="14" style="fill:#D6EEF4">azure-labs &#183; lab 01 governance and tagging &#183; every create or update runs Modify first, then every Deny</text><text class="t" x="40" y="132" font-size="12" font-weight="700" letter-spacing="1.2" style="fill:#5B6B85">EVALUATION ORDER</text><rect x="180" y="116" width="170" height="24" rx="12" fill="#D6EEF4" stroke="#0E7490" stroke-width="1"/><text class="t" x="265.0" y="133" font-size="12" font-weight="600" text-anchor="middle" style="fill:#0E7490">1  Modify / Append</text><path d="M354 128 h14 m-5 -4 l5 4 l-5 4" fill="none" stroke="#5B6B85" stroke-width="1.5"/><rect x="376" y="116" width="82" height="24" rx="12" fill="#F7E4DF" stroke="#B0422A" stroke-width="1"/><text class="t" x="417.0" y="133" font-size="12" font-weight="600" text-anchor="middle" style="fill:#B0422A">2  Deny</text><path d="M462 128 h14 m-5 -4 l5 4 l-5 4" fill="none" stroke="#5B6B85" stroke-width="1.5"/><rect x="484" y="116" width="90" height="24" rx="12" fill="#ECF6F9" stroke="#5B6B85" stroke-width="1"/><text class="t" x="529.0" y="133" font-size="12" font-weight="600" text-anchor="middle" style="fill:#5B6B85">3  Audit</text><path d="M578 128 h14 m-5 -4 l5 4 l-5 4" fill="none" stroke="#5B6B85" stroke-width="1.5"/><rect x="600" y="116" width="186" height="24" rx="12" fill="#ECF6F9" stroke="#5B6B85" stroke-width="1"/><text class="t" x="693.0" y="133" font-size="12" font-weight="600" text-anchor="middle" style="fill:#5B6B85">4  DeployIfNotExists</text><rect x="298" y="160" width="124" height="460" rx="14" fill="#D6EEF4" opacity="0.65"/><rect x="298" y="160" width="124" height="6" rx="3" fill="#0E7490"/><text class="t" x="360" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#0E7490">P1 &#183; Modify</text><text class="t" x="360" y="207" font-size="11" text-anchor="middle" style="fill:#16202B">inherit costCenter</text><text class="t" x="360" y="222" font-size="10" font-weight="600" letter-spacing="0.8" text-anchor="middle" style="fill:#5B6B85">ON RESOURCE GROUP</text><rect x="478" y="160" width="124" height="460" rx="14" fill="#F7E4DF" opacity="0.65"/><rect x="478" y="160" width="124" height="6" rx="3" fill="#B0422A"/><text class="t" x="540" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#B0422A">P2 &#183; Deny</text><text class="t" x="540" y="207" font-size="11" text-anchor="middle" style="fill:#16202B">require costCenter</text><text class="t" x="540" y="222" font-size="10" font-weight="600" letter-spacing="0.8" text-anchor="middle" style="fill:#5B6B85">ON RESOURCE GROUP</text><rect x="658" y="160" width="124" height="460" rx="14" fill="#F7E4DF" opacity="0.65"/><rect x="658" y="160" width="124" height="6" rx="3" fill="#B0422A"/><text class="t" x="720" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#B0422A">P3 &#183; Deny</text><text class="t" x="720" y="207" font-size="11" text-anchor="middle" style="fill:#16202B">require owner</text><text class="t" x="720" y="222" font-size="10" font-weight="600" letter-spacing="0.8" text-anchor="middle" style="fill:#5B6B85">ON RESOURCE GROUP</text><rect x="838" y="160" width="124" height="460" rx="14" fill="#F7E4DF" opacity="0.65"/><rect x="838" y="160" width="124" height="6" rx="3" fill="#B0422A"/><text class="t" x="900" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#B0422A">P4 &#183; Deny</text><text class="t" x="900" y="207" font-size="11" text-anchor="middle" style="fill:#16202B">allowed locations: East US</text><text class="t" x="900" y="222" font-size="10" font-weight="600" letter-spacing="0.8" text-anchor="middle" style="fill:#D98E04">ON SUBSCRIPTION</text><text class="t" x="1080" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#08152F">Result</text><text class="t" x="150" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#08152F">Request</text><line x1="238.0" y1="300" x2="1010" y2="300" stroke="#D3DEE6" stroke-width="2" stroke-dasharray="4 6"/><g class="anim mk00"><rect x="308" y="243" width="104" height="22" rx="11" fill="#0E7490"/><text class="t m" x="360" y="259" font-size="11" font-weight="700" text-anchor="middle" style="fill:#FFFFFF">+ costCenter</text></g><g class="anim mk01"><circle cx="540" cy="256" r="13" fill="#0F6E56"/><path d="M534 256 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mk02"><circle cx="720" cy="256" r="13" fill="#0F6E56"/><path d="M714 256 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mk03"><circle cx="900" cy="256" r="13" fill="#0F6E56"/><path d="M894 256 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mv0"><g style="animation:fadecycle 14s linear infinite"><rect x="62.0" y="271.0" width="176" height="58" rx="12" fill="#08152F"/><rect class="anim st0" x="62.0" y="271.0" width="176" height="58" rx="12" fill="#0F6E56"/><rect x="62.0" y="271.0" width="6" height="58" rx="3" fill="#2DD4E8"/><text class="t m" x="78.0" y="293.0" font-size="13" font-weight="700" style="fill:#FFFFFF">vnet-p3-ok</text><text class="t" x="78.0" y="312.0" font-size="11.5" style="fill:#D6EEF4">tags: owner &#183; East US</text><g class="anim cp0"><rect x="164.0" y="262.0" width="82" height="18" rx="9" fill="#2DD4E8"/><text class="t" x="205.0" y="275.0" font-size="10" font-weight="700" text-anchor="middle" style="fill:#08152F">+ costCenter</text></g></g></g><g class="anim oc0"><rect x="988" y="334" width="184" height="46" rx="10" fill="#E3F4EE" stroke="#0F6E56" stroke-width="1.2"/><text class="t" x="1080" y="354" font-size="13" font-weight="700" text-anchor="middle" style="fill:#0F6E56">Created</text><text class="t m" x="1080" y="371" font-size="10" text-anchor="middle" style="fill:#16202B">costCenter added, owner kept</text></g><line x1="238.0" y1="420" x2="1010" y2="420" stroke="#D3DEE6" stroke-width="2" stroke-dasharray="4 6"/><g class="anim mk10"><rect x="308" y="363" width="104" height="22" rx="11" fill="#0E7490"/><text class="t m" x="360" y="379" font-size="11" font-weight="700" text-anchor="middle" style="fill:#FFFFFF">+ costCenter</text></g><g class="anim mk11"><circle cx="540" cy="376" r="13" fill="#0F6E56"/><path d="M534 376 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mk12"><circle cx="720" cy="376" r="13" fill="#B0422A"/><path d="M715 371 l10 10 m0 -10 l-10 10" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/></g><g class="anim mv1"><g style="animation:fadecycle 14s linear infinite"><rect x="62.0" y="391.0" width="176" height="58" rx="12" fill="#08152F"/><rect class="anim st1" x="62.0" y="391.0" width="176" height="58" rx="12" fill="#B0422A"/><rect x="62.0" y="391.0" width="6" height="58" rx="3" fill="#2DD4E8"/><text class="t m" x="78.0" y="413.0" font-size="13" font-weight="700" style="fill:#FFFFFF">vnet-p3-noowner</text><text class="t" x="78.0" y="432.0" font-size="11.5" style="fill:#D6EEF4">tags: none &#183; East US</text><g class="anim cp1"><rect x="164.0" y="382.0" width="82" height="18" rx="9" fill="#2DD4E8"/><text class="t" x="205.0" y="395.0" font-size="10" font-weight="700" text-anchor="middle" style="fill:#08152F">+ costCenter</text></g></g></g><g class="anim oc1"><rect x="988" y="454" width="184" height="46" rx="10" fill="#F7E4DF" stroke="#B0422A" stroke-width="1.2"/><text class="t" x="1080" y="474" font-size="13" font-weight="700" text-anchor="middle" style="fill:#B0422A">Refused by P3</text><text class="t m" x="1080" y="491" font-size="10" text-anchor="middle" style="fill:#16202B">RequestDisallowedByPolicy</text></g><line x1="238.0" y1="540" x2="1010" y2="540" stroke="#D3DEE6" stroke-width="2" stroke-dasharray="4 6"/><g class="anim mk20"><rect x="308" y="483" width="104" height="22" rx="11" fill="#0E7490"/><text class="t m" x="360" y="499" font-size="11" font-weight="700" text-anchor="middle" style="fill:#FFFFFF">+ costCenter</text></g><g class="anim mk21"><circle cx="540" cy="496" r="13" fill="#0F6E56"/><path d="M534 496 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mk22"><circle cx="720" cy="496" r="13" fill="#0F6E56"/><path d="M714 496 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mk23"><circle cx="900" cy="496" r="13" fill="#B0422A"/><path d="M895 491 l10 10 m0 -10 l-10 10" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/></g><g class="anim mv2"><g style="animation:fadecycle 14s linear infinite"><rect x="62.0" y="511.0" width="176" height="58" rx="12" fill="#08152F"/><rect class="anim st2" x="62.0" y="511.0" width="176" height="58" rx="12" fill="#B0422A"/><rect x="62.0" y="511.0" width="6" height="58" rx="3" fill="#2DD4E8"/><text class="t m" x="78.0" y="533.0" font-size="13" font-weight="700" style="fill:#FFFFFF">vnet-westus</text><text class="t" x="78.0" y="552.0" font-size="11.5" style="fill:#D6EEF4">tags: owner &#183; West US</text><g class="anim cp2"><rect x="164.0" y="502.0" width="82" height="18" rx="9" fill="#2DD4E8"/><text class="t" x="205.0" y="515.0" font-size="10" font-weight="700" text-anchor="middle" style="fill:#08152F">+ costCenter</text></g></g></g><g class="anim oc2"><rect x="988" y="574" width="184" height="46" rx="10" fill="#F7E4DF" stroke="#B0422A" stroke-width="1.2"/><text class="t" x="1080" y="594" font-size="13" font-weight="700" text-anchor="middle" style="fill:#B0422A">Refused by P4</text><text class="t m" x="1080" y="611" font-size="10" text-anchor="middle" style="fill:#16202B">RequestDisallowedByPolicy</text></g><rect x="24" y="650" width="1152" height="56" rx="12" fill="#ECF6F9"/><rect x="40" y="666" width="22" height="24" rx="4" fill="#D98E04"/><path d="M45 666 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#D98E04" stroke-width="2.5"/><text class="t" x="76" y="676" font-size="13" font-weight="700" style="fill:#08152F">Lock on the resource group: Delete (CanNotDelete)</text><text class="t" x="76" y="694" font-size="12" style="fill:#5B6B85">Blocks deletion for everyone, Owners included. Changes still go through, and still face every Deny rule.</text><text class="t" x="1160" y="684" font-size="12" text-anchor="end" style="fill:#0E7490">A remediation task is an update too: P3 refused P1&#8217;s fix on vnet-before.</text></svg>