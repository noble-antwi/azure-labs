</defs><rect x="0" y="0" width="1200" height="730" rx="18" fill="#060D1F"/><rect x="0" y="0" width="1200" height="730" rx="18" fill="url(#grid)"/><text class="t" x="96" y="44" font-size="24" font-weight="700" style="fill:#F4FAFD">How Azure Policy judged three requests</text><text class="t" x="96" y="74" font-size="14" style="fill:#9BE8F2">azure-labs &#183; lab 01 governance and tagging &#183; every create or update runs Modify first, then every Deny</text><rect x="0" y="96" width="1200" height="2" fill="#2DD4E8" opacity="0.9"/><g transform="translate(52 52)"><path d="M0 -26 L20 -17 V4 Q20 16 0 26 Q-20 16 -20 4 V-17 Z" fill="#08152F" stroke="#2DD4E8" stroke-width="2.5" filter="url(#glowC)"/><circle cx="0" cy="0" r="12" fill="none" stroke="#2DD4E8" stroke-width="1" opacity="0.5"/><circle cx="0" cy="0" r="4" fill="#2DD4E8"/><g class="anim" style="animation:sweep 6s linear infinite;transform-origin:0px 0px"><path d="M0 0 L-7 -16 A17 17 0 0 1 7 -16 Z" fill="#2DD4E8" opacity="0.45"/></g></g><text class="t" x="40" y="132" font-size="12" font-weight="700" letter-spacing="1.2" style="fill:#8FA3BF">EVALUATION ORDER</text><rect x="190" y="116" width="170" height="24" rx="12" fill="#0A1830" stroke="#2DD4E8" stroke-width="1.2"/><text class="t" x="275.0" y="133" font-size="12" font-weight="600" text-anchor="middle" style="fill:#2DD4E8">1  Modify / Append</text><path d="M364 128 h14 m-5 -4 l5 4 l-5 4" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><rect x="386" y="116" width="82" height="24" rx="12" fill="#0A1830" stroke="#FF6B5E" stroke-width="1.2"/><text class="t" x="427.0" y="133" font-size="12" font-weight="600" text-anchor="middle" style="fill:#FF6B5E">2  Deny</text><path d="M472 128 h14 m-5 -4 l5 4 l-5 4" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><rect x="494" y="116" width="90" height="24" rx="12" fill="#0A1830" stroke="#8FA3BF" stroke-width="1.2"/><text class="t" x="539.0" y="133" font-size="12" font-weight="600" text-anchor="middle" style="fill:#8FA3BF">3  Audit</text><path d="M588 128 h14 m-5 -4 l5 4 l-5 4" fill="none" stroke="#8FA3BF" stroke-width="1.5"/><rect x="610" y="116" width="186" height="24" rx="12" fill="#0A1830" stroke="#8FA3BF" stroke-width="1.2"/><text class="t" x="703.0" y="133" font-size="12" font-weight="600" text-anchor="middle" style="fill:#8FA3BF">4  DeployIfNotExists</text><rect x="298" y="160" width="124" height="460" rx="14" fill="#0B2638" stroke="#1C3050" stroke-width="1"/><rect x="298" y="160" width="124" height="6" rx="3" fill="#2DD4E8"/><text class="t" x="360" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#2DD4E8">P1 &#183; Modify</text><text class="t" x="360" y="207" font-size="11" text-anchor="middle" style="fill:#D6EEF4">inherit costCenter</text><text class="t" x="360" y="222" font-size="10" font-weight="600" letter-spacing="0.8" text-anchor="middle" style="fill:#8FA3BF">ON RESOURCE GROUP</text><rect x="478" y="160" width="124" height="460" rx="14" fill="#26131C" stroke="#1C3050" stroke-width="1"/><rect x="478" y="160" width="124" height="6" rx="3" fill="#FF6B5E"/><text class="t" x="540" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">P2 &#183; Deny</text><text class="t" x="540" y="207" font-size="11" text-anchor="middle" style="fill:#D6EEF4">require costCenter</text><text class="t" x="540" y="222" font-size="10" font-weight="600" letter-spacing="0.8" text-anchor="middle" style="fill:#8FA3BF">ON RESOURCE GROUP</text><rect x="658" y="160" width="124" height="460" rx="14" fill="#26131C" stroke="#1C3050" stroke-width="1"/><rect x="658" y="160" width="124" height="6" rx="3" fill="#FF6B5E"/><text class="t" x="720" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">P3 &#183; Deny</text><text class="t" x="720" y="207" font-size="11" text-anchor="middle" style="fill:#D6EEF4">require owner</text><text class="t" x="720" y="222" font-size="10" font-weight="600" letter-spacing="0.8" text-anchor="middle" style="fill:#8FA3BF">ON RESOURCE GROUP</text><rect x="838" y="160" width="124" height="460" rx="14" fill="#26131C" stroke="#1C3050" stroke-width="1"/><rect x="838" y="160" width="124" height="6" rx="3" fill="#FF6B5E"/><text class="t" x="900" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">P4 &#183; Deny</text><text class="t" x="900" y="207" font-size="11" text-anchor="middle" style="fill:#D6EEF4">allowed locations: East US</text><text class="t" x="900" y="222" font-size="10" font-weight="600" letter-spacing="0.8" text-anchor="middle" style="fill:#FFC04D">ON SUBSCRIPTION</text><text class="t" x="1080" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#F4FAFD">Result</text><text class="t" x="150" y="190" font-size="15" font-weight="700" text-anchor="middle" style="fill:#F4FAFD">Request</text><line x1="238.0" y1="300" x2="1010" y2="300" stroke="#1C3050" stroke-width="2" stroke-dasharray="4 6"/><g class="anim mk00"><rect x="308" y="243" width="104" height="22" rx="11" fill="#2DD4E8" filter="url(#glowC)"/><text class="t m" x="360" y="259" font-size="11" font-weight="700" text-anchor="middle" style="fill:#08152F">+ costCenter</text></g><g class="anim mk01"><circle cx="540" cy="256" r="13" fill="#2BD99F" filter="url(#glowG)"/><path d="M534 256 l4 4 l8 -9" fill="none" stroke="#08152F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mk02"><circle cx="720" cy="256" r="13" fill="#2BD99F" filter="url(#glowG)"/><path d="M714 256 l4 4 l8 -9" fill="none" stroke="#08152F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mk03"><circle cx="900" cy="256" r="13" fill="#2BD99F" filter="url(#glowG)"/><path d="M894 256 l4 4 l8 -9" fill="none" stroke="#08152F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mv0"><g style="animation:fadecycle 14s linear infinite"><rect x="62.0" y="271.0" width="176" height="58" rx="12" fill="#0A18