th="1.4"/><rect class="anim st1" x="62.0" y="391.0" width="176" height="58" rx="12" fill="#3A1620" stroke="#FF6B5E" stroke-width="1.6"/><rect x="62.0" y="401.0" width="5" height="38" rx="2.5" fill="#2DD4E8"/><text class="t m" x="80.0" y="413.0" font-size="13" font-weight="700" style="fill:#F4FAFD">vnet-p3-noowner</text><text class="t" x="80.0" y="432.0" font-size="11.5" style="fill:#D6EEF4">tags: none &#183; East US</text><g class="anim cp1"><rect x="164.0" y="382.0" width="82" height="18" rx="9" fill="#2DD4E8"/><text class="t" x="205.0" y="395.0" font-size="10" font-weight="700" text-anchor="middle" style="fill:#08152F">+ costCenter</text></g></g></g><g class="anim oc1"><rect x="988" y="454" width="184" height="46" rx="10" fill="#3A1620" stroke="#FF6B5E" stroke-width="1.2"/><text class="t" x="1080" y="474" font-size="13" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">Refused by P3</text><text class="t m" x="1080" y="491" font-size="10" text-anchor="middle" style="fill:#D6EEF4">RequestDisallowedByPolicy</text></g><line x1="238.0" y1="540" x2="1010" y2="540" stroke="#1C3050" stroke-width="2" stroke-dasharray="4 6"/><g class="anim mk20"><rect x="308" y="483" width="104" height="22" rx="11" fill="#2DD4E8" filter="url(#glowC)"/><text class="t m" x="360" y="499" font-size="11" font-weight="700" text-anchor="middle" style="fill:#08152F">+ costCenter</text></g><g class="anim mk21"><circle cx="540" cy="496" r="13" fill="#2BD99F" filter="url(#glowG)"/><path d="M534 496 l4 4 l8 -9" fill="none" stroke="#08152F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mk22"><circle cx="720" cy="496" r="13" fill="#2BD99F" filter="url(#glowG)"/><path d="M714 496 l4 4 l8 -9" fill="none" stroke="#08152F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="anim mk23"><circle cx="900" cy="496" r="13" fill="#FF6B5E" filter="url(#glowR)"/><path d="M895 491 l10 10 m0 -10 l-10 10" stroke="#08152F" stroke-width="2.6" stroke-linecap="round"/></g><g class="anim mv2"><g style="animation:fadecycle 14s linear infinite"><rect x="62.0" y="511.0" width="176" height="58" rx="12" fill="#0A1830" stroke="#2DD4E8" stroke-width="1.4"/><rect class="anim st2" x="62.0" y="511.0" width="176" height="58" rx="12" fill="#3A1620" stroke="#FF6B5E" stroke-width="1.6"/><rect x="62.0" y="521.0" width="5" height="38" rx="2.5" fill="#2DD4E8"/><text class="t m" x="80.0" y="533.0" font-size="13" font-weight="700" style="fill:#F4FAFD">vnet-westus</text><text class="t" x="80.0" y="552.0" font-size="11.5" style="fill:#D6EEF4">tags: owner &#183; West US</text><g class="anim cp2"><rect x="164.0" y="502.0" width="82" height="18" rx="9" fill="#2DD4E8"/><text class="t" x="205.0" y="515.0" font-size="10" font-weight="700" text-anchor="middle" style="fill:#08152F">+ costCenter</text></g></g></g><g class="anim oc2"><rect x="988" y="574" width="184" height="46" rx="10" fill="#3A1620" stroke="#FF6B5E" stroke-width="1.2"/><text class="t" x="1080" y="594" font-size="13" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">Refused by P4</text><text class="t m" x="1080" y="611" font-size="10" text-anchor="middle" style="fill:#D6EEF4">RequestDisallowedByPolicy</text></g><rect x="24" y="650" width="1152" height="56" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><rect x="40" y="668" width="22" height="24" rx="4" fill="#FFC04D"/><path d="M45 668 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#FFC04D" stroke-width="2.5"/><text class="t" x="76" y="678" font-size="13" font-weight="700" style="fill:#F4FAFD">Lock on the resource group: Delete (CanNotDelete)</text><text class="t" x="76" y="696" font-size="12" style="fill:#8FA3BF">Blocks deletion for everyone, Owners included. Changes still go through, and still face every Deny rule.</text><text class="t" x="1160" y="686" font-size="12" text-anchor="end" style="fill:#9BE8F2">A remediation task is an update too: P3 refused P1&#8217;s fix on vnet-before.</text></svg>