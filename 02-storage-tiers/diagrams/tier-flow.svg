40px);opacity:0}}.pl2{animation:pl2 18s linear infinite}@keyframes msg2{0%,54.9%{opacity:0}56.5%,73.0%{opacity:1}74.5%,100%{opacity:0}}.msg2{animation:msg2 18s linear infinite}@keyframes pl3{0%,73.9%{transform:translateX(0px);opacity:0}74.5%{opacity:1}81.0%{transform:translateX(940px);opacity:1}82.0%,100%{transform:translateX(940px);opacity:0}}.pl3{animation:pl3 18s linear infinite}@keyframes msg3{0%,80.9%{opacity:0}82.5%,93.0%{opacity:1}94.5%,100%{opacity:0}}.msg3{animation:msg3 18s linear infinite}</style><defs>
